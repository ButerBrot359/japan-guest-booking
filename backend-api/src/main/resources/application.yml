server:
  # за nginx getRemoteAddr() читает X-Forwarded-For; при прямом доступе (dev) ничего не меняет
  forward-headers-strategy: native

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/guestbooking
    username: dev
    password: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

app:
  jwt:
    # dev-заглушка; боевой секрет придёт из .env на этапе 8 (в git не попадает)
    secret: dev-secret-change-me-0123456789abcdef
    ttl-days: 30
  admin:
    # dev-заглушки; боевые значения придут из .env на этапе 8
    phone: "+818000000000"
    password: admin-dev-password
  bot:
    # dev/тест-заглушка; боевой BOT_API_TOKEN придёт из .env
    api-token: ${BOT_API_TOKEN:}
